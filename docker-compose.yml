  #     - "5173:5173"  # Vite の開発サーバーにアクセスできるようにポートを公開
  #   volumes:
  #     - ./frontend/web:/app
  #   environment:
  #     - NODE_ENV=development
    
  db:
    image: mysql:5.7
    container_name: db
    platform: linux/x86_64
    #It is recommended that environment variables be managed in env files
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: sample_db
      MYSQL_USER: mysqluser
      MYSQL_PASSWORD: mysqlpass
    volumes:
      - ./db/data:/var/lib/mysql
      - ./db/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./db/initdb.d:/docker-entrypoint-initdb.d
    ports:
      - 3308:3308
    command: --port 3308
    tty: true


