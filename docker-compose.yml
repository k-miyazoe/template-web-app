services:
  backend:
    image: fastapi:v1.0
    container_name: backend
    stdin_open: true
    tty: true
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8005:8005'
    volumes:
      - ./backend/app:/app
    env_file:
      - ./backend/dev.env

  frontend:
    image: react:v1.0
    container_name: frontend
    #privileged 特権モード
    privileged: true
    restart: always
    stdin_open: true
    tty: true
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/usr/src/app
    command: /bin/sh

  db:
    image: mysql:5.7
    container_name: db
    platform: linux/x86_64
    #It is recommended that environment variables be managed in env files
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: sample_db
      MYSQL_USER: mysqluser
      MYSQL_PASSWORD: mysqlpass
    volumes:
      - ./db/data:/var/lib/mysql
      - ./db/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./db/initdb.d:/docker-entrypoint-initdb.d
    ports:
      - 3308:3308
    command: --port 3308
    tty: true


