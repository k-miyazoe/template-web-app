services:
  backend:
    image: fastapi:v1.0
    container_name: backend
    stdin_open: true
    tty: true
    restart: always
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8005:8005'
    volumes:
      - ./backend/app:/app
    env_file:
      - ./backend/dev.env
  
  # frontend:
  #   image: react:v1.0
  #   container_name: frontend
  #   stdin_open: true
  #   tty: true
  #   build:
  #     context: ./frontend/web
  #     dockerfile: Dockerfile
